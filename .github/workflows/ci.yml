name: Policy & Unit Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Test Suite
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"

      - name: Validate Kyverno & Gatekeeper Manifests
        run: |
          make test-policies
